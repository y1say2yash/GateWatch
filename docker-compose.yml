services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend/Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    expose:
      - "5173"
    command: npm run dev -- --host 0.0.0.0

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend/Dockerfile
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - .env
    expose:
      - "${BACKEND_PORT}"
    depends_on:
      - postgres
      - redis
      - product-api
      - order-api
      - user-api

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT}:6379"

  order-api:
    build:
      context: ./services/order-api
      dockerfile: ../../infrastructure/docker/demo-apis/order-api/Dockerfile
    volumes:
      - ./services/order-api:/app
      - /app/node_modules
    environment:
      PORT: ${ORDER_API_PORT}
    ports:
      - "${ORDER_API_PORT}:${ORDER_API_PORT}"

  product-api:
    build:
      context: ./services/product-api
      dockerfile: ../../infrastructure/docker/demo-apis/product-api/Dockerfile
    volumes:
      - ./services/product-api:/app
      - /app/node_modules
    environment:
      PORT: ${PRODUCT_API_PORT}
    ports:
      - "${PRODUCT_API_PORT}:${PRODUCT_API_PORT}"

  user-api:
    build:
      context: ./services/user-api
      dockerfile: ../../infrastructure/docker/demo-apis/user-api/Dockerfile
    volumes:
      - ./services/user-api:/app
      - /app/node_modules
    environment:
      PORT: ${USER_API_PORT}
    ports:
      - "${USER_API_PORT}:${USER_API_PORT}"

volumes:
  postgres_data: